name: Set up Godot
description: Installs the Godot editor as `godot` on PATH and imports the project so GUT tests can run headless.

inputs:
  version:
    description: Godot version, matching a godotengine/godot release tag without the "-stable" suffix
    default: "4.7.2"

runs:
  using: composite
  steps:
    - name: Cache Godot
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/godot
        key: godot-${{ inputs.version }}-linux-x86_64

    - name: Download Godot
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p ~/godot
        curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${{ inputs.version }}-stable/Godot_v${{ inputs.version }}-stable_linux.x86_64.zip"
        unzip -q /tmp/godot.zip -d ~/godot
        mv ~/godot/Godot_v${{ inputs.version }}-stable_linux.x86_64 ~/godot/godot
        chmod +x ~/godot/godot

    - name: Add Godot to PATH
      shell: bash
      run: echo "$HOME/godot" >> "$GITHUB_PATH"

    # Builds .godot/ (class name cache, imported resources) so scripts resolve their class_name references.
    - name: Import project
      shell: bash
      run: godot --headless --import
